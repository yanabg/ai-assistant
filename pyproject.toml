[project]
name = "desktop-chat"
version = "0.1.0"
description = "A streaming desktop chat client (tkinter) with a pluggable AI backend seam."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.47.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
chatapp = "chatapp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatapp"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
]

# --- Linting & formatting -----------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["chatapp"]

[tool.ruff.format]
docstring-code-format = true

# --- Type checking ------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
